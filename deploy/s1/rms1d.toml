# O arquivo real do robô. O que não está aqui segue os padrões de `rms1d-params`, cada um com a fonte.
[robo]
nome = "rms1"

[corpo]
tipo = "serial"
porta = "/dev/ttyS3"
baud = 921600
# Grava cada quadro enviado, para comparar com o simulador. Tirar depois da prova.
gravar = "/var/lib/robot/rms1d-quadros.ndjson"
# Grava cada leitura do corpo, para reprocessar sem o robô (`rms1d-reprocessar`). Pela conta, só os 50 pacotes de 176 bytes
# por segundo, em hexadecimal, dão cerca de 63 MB por hora; os outros quadros somam a isso. Tirar depois da prova em modo
# sombra.
gravar_recebido = "/var/lib/robot/rms1d-recebido.txt"
# "dji", o que a biblioteca lê; "proroklab" é o plano B, que moveu o robô em 2026-10-29.
permissao = "dji"

[torre]
# 4 é yaw no chassi e pitch NED, o padrão da DJI; 3 é o plano B, que moveu a torre em 2026-10-29.
coordenada = 4

[armadura]
# De 0 a 10, como no app da DJI; maior, golpe mais leve conta. 10 é o máximo da DJI, pelo pedido do dono em 2026-11-03:
# "Deixe as placas sensíveis ao toque". O padrão da DJI é 5.
sensibilidade = 10

[dji]
# O monitor primeiro: ele religa quem cair.
parar = ["dji_monitor", "dji_hdvt_uav"]
