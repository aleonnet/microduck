# O arquivo real do robô. O que não está aqui segue os padrões de `rms1d-params`, cada um com a fonte.
[robo]
nome = "rms1"

[corpo]
tipo = "serial"
porta = "/dev/ttyS3"
baud = 921600
# Grava cada quadro enviado, para comparar com o simulador. Tirar depois da prova.
gravar = "/var/lib/robot/rms1d-quadros.ndjson"
# Grava cada leitura do corpo, para reprocessar sem o robô (`rms1d-reprocessar`). Medido em 2026-11-15: as duas gravações
# somam 2,49 MB por minuto. Tirar depois da prova em modo sombra.
gravar_recebido = "/var/lib/robot/rms1d-recebido.txt"
# O limite das duas somadas, em MiB: chegando nele, a gravação para e o robô segue (cerca de 27 minutos). Sem limite, duas
# gravações esquecidas encheram o disco do robô em 2026-11-15, e a ativação confere duas vezes este tanto livre antes de subir.
gravar_limite_mb = 64
# "dji", o que a biblioteca lê; "proroklab" é o plano B, que moveu o robô em 2026-10-29.
permissao = "dji"

[torre]
# 4 é yaw no chassi e pitch NED, o padrão da DJI; 3 é o plano B, que moveu a torre em 2026-10-29.
coordenada = 4

[armadura]
# De 0 a 10, como no app da DJI; maior, golpe mais leve conta. 10 é o máximo da DJI, pelo pedido do dono em 2026-11-03:
# "Deixe as placas sensíveis ao toque". O padrão da DJI é 5.
sensibilidade = 10

[mira]
# Onde o `dji_hdvt_uav` guarda a mira que o app ajusta, `/data/rm_user_setting.json`, visto de dentro do chroot: a bancada liga o
# `/data` da DJI em `/mnt/dji`. Com ele parado, quem lê e grava é o `rms1d` (`s1.sight`).
arquivo = "/mnt/dji/rm_user_setting.json"

[dji]
# O monitor primeiro: ele religa quem cair. O `dji_camera` por último: ele segura a câmera e o microfone, e sai só pelo
# `init`, sem `kill` (a bancada cuida disso).
parar = ["dji_monitor", "dji_hdvt_uav", "dji_camera"]

# A mídia do robô, do `rms1-mediad`: a câmera pela sequência da DJI, o microfone pelo canal esquerdo a 16 kHz, e o som pelo
# `aplay`. Com a DJI parada, é ele quem deixa o chip de áudio como a partida dela deixa.
[midia]
mixer = true
# A porta em que a tela do simulador busca a imagem da câmera, direto pela rede e em JPEG: pelo `adb` um quadro levava mais
# de 4 s. Por ela só se olha: nenhum comando passa.
porta_video = 47010

[midia.camera]
fonte = "s1"

[midia.microfone]
fonte = "arecord"

[midia.alto_falante]
saida = "aplay"
