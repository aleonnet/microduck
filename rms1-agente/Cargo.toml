# `rms1-agente`: quem cumpre no corpo do S1 o pedido que a estação Hailo validou. Recebe o pedido pelo `rms1-mediad` e
# comanda o `rms1d`, pelas habilidades de uma tabela em arquivo. Desenho: docs/s1/design/rms1-agente.md.
[package]
name = "rms1-agente"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "O agente do RoboMaster S1: cumpre no corpo o pedido validado pela estação"

[lib]
name = "rms1_agente"

[[bin]]
name = "rms1-agente"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
duck-ipc-proto = { path = "../duck-ipc-proto" }
rms1d-params = { path = "../rms1d-params" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync"] }
toml = "0.9"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# O `rms1d` de verdade, com o corpo falso, para o agente ser provado contra o servidor e o laço que vão ao robô.
rms1-control = { path = "../rms1-control" }
rms1d = { path = "../rms1d" }
tempfile = "3"
