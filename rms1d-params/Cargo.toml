# Os parâmetros de `rms1d`: esquema, padrões e validação de `rms1d.toml`, no padrão de `robotd-params`.
# O formato do protocolo fica em código tipado (`rms1-proto`); o que varia fica aqui.
[package]
name = "rms1d-params"
version.workspace = true
edition.workspace = true
