# `s1d` — the RoboMaster S1's body service: the `robot.*` half of the microduck contract that a
# mecanum chassis and a two-axis gimbal can honour, served on `/run/robotd.sock` where `robotd`
# would be. `netpadd` and `robotctl` ran against it; `mediad` never has (`docs/s1/robot/s1-commands.md`).
#
# Below the contract it speaks DUML (`s1-duml`) on `/dev/ttyS3`. It is deliberately not a port of
# `robotd`: that daemon is fifteen servos and a policy; this one is a twist, two angles, twenty LEDs
# and the telemetry the motion controller pushes back. What it copies from `robotd` is the shape
# that made the contract honest — stamped intent slots, a loop that never waits on a client, health
# computed from atomics the loop publishes — and the IPC server around the socket.
[package]
name = "s1d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The RoboMaster S1 body service: robot.* over the microduck contract, DUML on /dev/ttyS3"

[dependencies]
duck-ipc-proto = { path = "../duck-ipc-proto" }
s1-duml = { path = "../s1-duml" }
arc-swap = "1"
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
# `default-features = false` drops `libudev`, for the reason `duck-control/Cargo.toml` gives: the
# port is opened by path, never enumerated, and libudev-sys has no sysroot in a cross-build.
serialport = { version = "4.8", default-features = false }
# `s1-e2e`: the pad datagram as `duckctl udp-pad` sends it (`pad_map::wire`), aimed at `netpadd`.
pad-map = { path = "../pad-map" }
# `s1-infer` (stage 12): the detector's ONNX path on this CPU. `ort` dlopens the library the bench
# built (`scripts/s1/build-onnxruntime.sh`), so nothing links at build time.
duck-detect = { path = "../duck-detect" }
anyhow = "1"
# `s1-cam`: the camera through `ioctl`/`mmap`/`poll` with the ARM32 UAPI layouts (`s1d::v4l2`).
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# `test-support` for `every_call()`: the dispatch test walks every robot route the contract has.
duck-ipc-proto = { path = "../duck-ipc-proto", features = ["test-support"] }
# Only to prove `deploy/s1/robotd.toml` loads with the validation `netpadd` applies to it.
robotd-params = { path = "../robotd-params" }
